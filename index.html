function openMetric(a){if(a==='gi')return renderGroups('WILAYAH GI',groupBy(towers,t=>t.gi),g=>towers.filter(t=>t.gi===g.key));if(a==='route')return renderGroups('RUAS / PENGHANTAR',groupBy(towers,t=>t.routeKey,t=>t.route),g=>towers.filter(t=>t.routeKey===g.key));if(a==='lw')return renderLw();const rows=a==='high'?towers.filter(t=>t.hazards.some(h=>h.level==='TINGGI')):a==='medium'?towers.filter(t=>t.hazards.some(h=>h.level==='SEDANG')):a==='safe'?towers.filter(t=>!t.hazards.length):a==='coords'?towers.filter(t=>t.lat!=null&&t.lon!=null):towers;renderTowerList(a==='high'?'TOWER RISIKO TINGGI':a==='medium'?'TOWER RISIKO SEDANG':a==='safe'?'TOWER AMAN':a==='coords'?'KOORDINAT LENGKAP':'SEMUA DATA TOWER',rows,renderSummary)}

const aliases={PROBO:'PROBOLINGGO',PROBOLINGO:'PROBOLINGGO',KRAKSAN:'KRAKSAAN',GONDANG:'GONDANGWETAN',LAYANGAN:'LAYANG2',LAYANG:'LAYANG2',SUSPENSI:'SUSPENSION',SUSPENTION:'SUSPENSION',SUSPENSSION:'SUSPENSION',TRANSPOSITION:'TRANSPOSISI',TRANSPOSSI:'TRANSPOSISI'};

function lev(a,b){const p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p.splice(0,p.length,...n)}return p[b.length]}
function correct(s){return norm(s).split(/\s+/).map(w=>{if(aliases[w])return aliases[w];if(!/\d/.test(w)&&w.length>=4){let best=w,d=99;vocab.forEach(x=>{const z=lev(w,x);if(z<d){d=z;best=x}});if(d<=(w.length>=7?2:1))return best}return w}).join(' ').trim()}
function norm(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('LAYANG-LAYANG','LAYANG2').replace('LAYANG LAYANG','LAYANG2')}
function search(q){const fixed=correct(q),parts=fixed.split(/[^A-Z0-9.+-]+/).filter(Boolean),no=(fixed.match(/(?:TOWER|T)?\s*\.?\s*0*(\d+[A-Z]?)/)||[])[1];return towers.filter(t=>{if(no&&t.no!==no)return false;const hay=norm([t.route,t.gi,t.lw,t.klw,t.village,t.district,t.type,t.code,t.asset,t.functional,...t.hazards.map(h=>h.type+' '+h.level)].join(' '));return parts.filter(x=>!['TOWER','T','NOMOR','NO','CARI','DATA','JENIS','TIPE','TYPE'].includes(x)&&x!==no).every(x=>hay.includes(x))})}

function distanceKm(a,b,c,d){const r=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function formatDistance(km){return km<1?`${Math.round(km*1000)} meter`:`${km.toFixed(2)} km`}
function renderNearest(){activate('nearest');app.innerHTML=`<h2 class="section-title green">TOWER TERDEKAT</h2><div class="card location-state"><span class="location-icon">⌖</span><b>Mendeteksi lokasi Anda…</b><small>Izinkan akses lokasi saat diminta oleh browser.</small></div>`;if(!navigator.geolocation){app.innerHTML+=`<div class="empty">Browser ini tidak mendukung pendeteksian lokasi.</div>`;return}navigator.geolocation.getCurrentPosition(p=>renderNearestResults(p.coords.latitude,p.coords.longitude),e=>{const msg=e.code===1?'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini.':e.code===2?'Lokasi tidak ditemukan. Pastikan GPS HP aktif.':'Waktu pencarian lokasi habis. Silakan coba lagi.';app.innerHTML=`<h2 class="section-title red">LOKASI BELUM TERDETEKSI</h2><div class="card location-state"><span class="location-icon">⚠</span><b>${msg}</b><button id="retryLocation" class="btn">COBA LAGI</button></div>`;document.querySelector('#retryLocation').onclick=renderNearest},{enableHighAccuracy:true,timeout:20000,maximumAge:30000})}
function renderNearestResults(lat,lon){const rows=towers.filter(t=>t.lat!=null&&t.lon!=null).map(t=>({...t,distance:distanceKm(lat,lon,Number(t.lat),Number(t.lon))})).sort((a,b)=>a.distance-b.distance).slice(0,10);app.innerHTML=`<h2 class="section-title green">10 TOWER TERDEKAT</h2><div class="count">Lokasi HP: ${lat.toFixed(6)}, ${lon.toFixed(6)} • ketuk tower untuk membuka detail</div><div class="list">${rows.map((t,i)=>`<button class="row tower-row ${i===0?'green':['blue','cyan','purple'][i%3]}" data-id="${esc(t.id)}"><b>${i+1}. ${esc(t.route)} &nbsp; T.${esc(t.no)}</b><small>${esc(giName(t.gi))} • ${formatDistance(t.distance)}<br>LW: ${esc(t.lw)}</small></button>`).join('')}</div>`;bindTowerRows(()=>renderNearestResults(lat,lon))}
function renderDetail(id){const t=towers.find(x=>x.id===id);if(!t)return;const fields=[['Status',t.status],['Jenis',t.type],['Kode',t.code],['ID Functional Location',t.functional],['Tegangan',t.voltage&&t.voltage+' kV'],['MDPL',t.mdpl],['Tinggi body',t.height&&t.height+' m'],['Panjang crossarm',t.crossarm],['Jumlah kawat tanah',t.groundWire],['Isolator/fasa',t.insulators],['Jarak jalan sepeda',t.bikeDistance],['Jarak jalan mobil',t.carDistance],['Geografis',t.geography],['Kontur tanah',t.soil],['Akses',t.access],['Desa/Kelurahan',t.village],['Kecamatan',t.district],['Kabupaten/Kota',t.city],['Provinsi',t.province],['Koordinat',t.lat!=null?`${t.lat}, ${t.lon}`:null],['Line Walker',t.lw],['Cakupan LW',t.lwCoverage],['No. HP LW',t.lwPhone],['KLW',t.klw],['No. HP KLW',t.klwPhone],['Wilayah KLW',t.klwArea]];app.innerHTML=`${backButton()}<h2 class="section-title blue">${esc(t.route)} • T.${esc(t.no)}</h2><div class="card"><div class="detail-grid">${fields.map(f=>`<div class="detail-item"><small>${f[0]}</small><b>${esc(f[1])}</b></div>`).join('')}</div></div><h3 class="section-title purple">KERAWANAN</h3><div class="card">${t.hazards.length?t.hazards.map(h=>`<div class="risk"><span class="dot" style="color:${h.level==='TINGGI'?C.red:C.yellow}">●</span><span><b>${esc(h.type)}</b><small style="color:${h.level==='TINGGI'?C.red:C.yellow}">${h.level}</small></span></div>`).join(''):'<div class="risk"><span class="dot" style="color:var(--green)">●</span><b>AMAN — tidak ada risiko SEDANG/TINGGI</b></div>'}</div><div class="actions">${t.lat!=null?`<a class="btn" target="_blank" href="https://www.google.com/maps?q=${t.lat},${t.lon}">BUKA MAPS</a>`:''}${t.lwPhone?`<a class="btn" target="_blank" href="https://wa.me/${phone(t.lwPhone)}">WHATSAPP LW</a>`:''}${t.klwPhone?`<a class="btn" target="_blank" href="https://wa.me/${phone(t.klwPhone)}">WHATSAPP KLW</a>`:''}</div>`;bindBack()}
function phone(s){const n=String(s).replace(/\D/g,'');return n.startsWith('0')?'62'+n.slice(1):n}
document.querySelectorAll('.bottom-nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderPage()});
document.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.theme=document.body.classList.contains('light')?'light':'dark';document.querySelector('#themeBtn').textContent=document.body.classList.contains('light')?'☾':'☀'};
if(localStorage.theme==='light'){document.body.classList.add('light');document.querySelector('#themeBtn').textContent='☾'}

renderSummary();

</script>
</body>
